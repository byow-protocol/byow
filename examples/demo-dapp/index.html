<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYOW demo site</title>
<style>
  :root { --ink:#1c1b19; --paper:#f6f3ec; --rule:#d9d3c4; --wax:#9b2c1f; --mute:#6b665b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece8dd; --paper:#161512; --rule:#3a362e; --wax:#e0705f; --mute:#9d978a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 ui-sans-serif,system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } p.lede { color:var(--mute); margin:0 0 24px; }
  label, .label { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:18px 0 6px; }
  input { width:100%; padding:11px; font:15px ui-monospace,Menlo,monospace; background:transparent; color:var(--ink); border:1px solid var(--ink); }
  button { padding:11px 16px; font:600 15px ui-sans-serif,system-ui; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--ink); }
  .origin { font:600 18px ui-monospace,Menlo,monospace; word-break:break-all; margin:0; }
  .claim { color:var(--mute); font-size:13px; margin:2px 0 0; display:flex; align-items:center; gap:8px; }
  .claim img { width:20px; height:20px; }
  .box { border-top:1px solid var(--rule); margin-top:22px; padding-top:4px; }
  .err { color:var(--wax); } pre { white-space:pre-wrap; word-break:break-all; font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Pay with any wallet</h1>
  <p class="lede">This site has never heard of your wallet. Paste its address and it works.</p>

  <div id="status" data-state="idle" hidden></div>

  <section id="connect-box">
    <label for="wallet-url">Wallet URL</label>
    <input id="wallet-url" autocomplete="off" spellcheck="false" list="remembered" placeholder="https://my-wallet.example/">
    <datalist id="remembered"></datalist>
    <label class="check"><input type="checkbox" id="by-link"> No popup: open the wallet in a tab and come back</label>
    <button id="connect" disabled>Connect wallet</button>
    <p id="error" class="err" role="alert" hidden></p>
  </section>

  <section id="session" class="box" hidden>
    <p class="label" id="origin-label">Connected wallet (browser-verified origin)</p>
    <p class="origin" id="origin"></p>
    <p class="claim"><img id="icon" alt="" hidden><span>Claims to be <b id="claimed"></b></span></p>
    <p class="label">Signed in as</p>
    <p class="origin" id="me"></p>
    <div id="pay" class="box"></div>
    <pre id="result"></pre>
  </section>
</main>
<script src="dist/app.js"></script>
</body>
</html>
