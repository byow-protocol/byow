<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toy Wallet</title>
<style>
  :root { --ink:#1c1b19; --paper:#f6f3ec; --rule:#d9d3c4; --wax:#9b2c1f; --mute:#6b665b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece8dd; --paper:#161512; --rule:#3a362e; --wax:#e0705f; --mute:#9d978a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:0 0 14px; }
  .toy { border:1px solid var(--wax); color:var(--wax); padding:8px 10px; font-size:12px; margin-bottom:18px; }
  .from { font:600 17px/1.3 ui-monospace,Menlo,monospace; word-break:break-all; margin:2px 0 4px; }
  .label { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; }
  table { width:100%; border-collapse:collapse; margin:16px 0; }
  td { padding:8px 0; border-top:1px solid var(--rule); vertical-align:top; }
  td:first-child { color:var(--mute); width:40%; }
  td:last-child { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  .warn { color:var(--wax); font:12px/1.4 ui-sans-serif,system-ui; display:block; margin-top:2px; }
  .row { display:flex; gap:10px; }
  button { flex:1; padding:12px; font:600 15px ui-sans-serif,system-ui; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  button#approve { background:var(--ink); color:var(--paper); }
  code { font-family:ui-monospace,Menlo,monospace; font-size:13px; word-break:break-all; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Toy Wallet</h1>
  <div class="toy">A demo wallet. The seed sits in localStorage. Testnet only. Do not put money in it.</div>

  <section id="idle">
    <p class="label">Your address</p>
    <p><code id="addr"></code></p>
    <p id="idle-note">Open a site that supports BYOW, choose "use another wallet", and paste this page's URL.</p>
  </section>

  <section id="ask" hidden>
    <p class="label" id="asker">Request from</p>
    <p class="from" id="origin"></p>
    <p class="label" id="title"></p>
    <table id="rows"></table>
    <div class="row"><button id="reject">Reject</button><button id="approve">Approve</button></div>
  </section>

  <section id="done" hidden><p id="done-text"></p></section>
</main>
<script src="dist/wallet.js"></script>
</body>
</html>
